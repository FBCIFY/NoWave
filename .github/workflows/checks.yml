name: NoWave CI
on:
  pull_request:
    branches: [dev, main, feature/NW-172, feature/NW-173, feature/NW-174]
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  # A newer PR revision can replace its checks, but never interrupt a deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - name: Check Python correctness
        run: ruff check backend deploy/hostinger mobile/tool --output-format=github
      - name: Check deployment shell syntax
        run: |
          for script in deploy/hostinger/*.sh; do
            bash -n "$script"
          done
      - name: API and unit tests
        if: ${{ !cancelled() }}
        run: python -m pytest backend/tests/api backend/tests/unit -q --junitxml=test-results/python.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: test-results/
          retention-days: 14
      - name: Summary
        if: always()
        run: echo "Python checks — ${{ job.status }}. Test report available in workflow artifacts." >> "$GITHUB_STEP_SUMMARY"
  admin-web:
    name: Admin Web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check admin JavaScript syntax
        run: |
          set -euo pipefail
          for file in backend/app/web/static/{login,surveillance,maritime-style,marker-icons,cluster-interaction}.js
          do
            node --check "$file"
          done

      - name: Test admin cartography
        run: node --test backend/tests/web/*.cjs

      - name: Validate production Nginx configuration
        run: |
          docker run --rm \
            -v "$PWD/deploy/web/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951 nginx -t

  flutter:
    name: Flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Flutter
        if: ${{ !cancelled() }}
        run: flutter analyze --no-pub
      - name: Unit and widget tests
        if: ${{ !cancelled() }}
        run: |
          mkdir -p ../test-results
          set -o pipefail
          flutter test --no-pub --machine --coverage | tee ../test-results/flutter.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-test-results
          path: |
            test-results/
            mobile/coverage/lcov.info
          retention-days: 14
      - name: Summary
        if: always()
        run: echo "Flutter checks — ${{ job.status }}. Test report and coverage available in workflow artifacts." >> "$GITHUB_STEP_SUMMARY"

  postgis:
    name: PostGIS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_FILE: compose.test.yaml
      COMPOSE_PROJECT_NAME: nowave-ci-${{ github.run_id }}-${{ github.run_attempt }}
      NOWAVE_TEST_ADMIN_URL: postgresql://nowave_ci:ci-test-only@127.0.0.1:55433/nowave_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - name: Start isolated PostgreSQL with PostGIS
        run: docker compose up -d --build --wait --wait-timeout 120 database
      - name: Migrations, schema, repositories and readiness
        run: python -m pytest backend/tests/database -q --junitxml=test-results/database.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/tests/browser/package-lock.json
      - name: Install admin browser tests
        run: |
          npm ci --prefix backend/tests/browser --ignore-scripts
          npm audit --prefix backend/tests/browser --audit-level=low
          cd backend/tests/browser
          npx playwright install --with-deps chromium
      - name: Admin browser journeys with isolated PostGIS
        env:
          PYTHON: python
        run: npm test --prefix backend/tests/browser -- admin.spec.cjs
      - name: Publish admin browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-browser-test-results
          path: backend/tests/browser/test-results/
          retention-days: 14
      - name: Database logs
        if: always()
        run: |
          mkdir -p test-results
          docker compose logs --no-color database > test-results/postgis.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-test-results
          path: test-results/
          retention-days: 14
      - name: Remove ephemeral database
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Summary
        if: always()
        run: echo "PostGIS checks — ${{ job.status }}. JUnit report and database logs available in workflow artifacts." >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    env:
      COMPOSE_PROJECT_NAME: nowave-web-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - name: Web tests
        if: ${{ !cancelled() }}
        run: |
          mkdir -p ../test-results
          set -o pipefail
          npm test | tee ../test-results/web.log
      - run: npm run build
      - name: Validate the standalone service
        run: docker compose config --quiet
      - name: Build and smoke-test Nginx
        run: |
          docker compose up --build -d --wait --wait-timeout 90
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8080/health
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8080/ > /dev/null
      - name: Web service logs
        if: always()
        run: |
          mkdir -p ../test-results
          docker compose logs --no-color > ../test-results/nginx.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: test-results/
          retention-days: 14
      - name: Stop test service
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Summary
        if: always()
        run: echo "Web checks — ${{ job.status }}. Test output and Nginx logs available in workflow artifacts." >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Production
    needs: [python, flutter, postgis, web, admin-web]
    uses: ./.github/workflows/production.yml
    secrets: inherit
