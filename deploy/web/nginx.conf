worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    client_max_body_size 32k;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Only the isolated tunnel connector can supply the visitor's address.
    set_real_ip_from 172.30.72.2;
    real_ip_header CF-Connecting-IP;
    log_format safe_json escape=json '{"time":"$time_iso8601","service":"nowave-edge","request_id":"$request_id","client_ip":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"duration":$request_time}';
    access_log /dev/stdout safe_json;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_origin $foreign_origin {
        default 1;
        "" 0;
        "https://no-wave.fr" 0;
        "https://www.no-wave.fr" 0;
        "https://api.no-wave.fr" 0;
    }
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Request-ID $request_id always;
    server {
        listen 8080 default_server;
        server_name _;
        location = /health {
            allow 127.0.0.1;
            deny all;
            access_log off;
            return 200 'ok';
        }
        location / { return 421; }
    }
    server {
        listen 8080;
        server_name www.no-wave.fr;
        return 308 https://no-wave.fr$request_uri;
    }
    server {
        listen 8080;
        server_name no-wave.fr api.no-wave.fr;
        root /usr/share/nginx/html;
        index index.html;
        limit_conn connections 30;
        if ($foreign_origin) { return 403; }
        location ~ ^/(api/|health(?:/|$)|version$) {
            limit_req zone=api_limit burst=30 nodelay;
            set $api http://api:8000;
            proxy_pass $api;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header CF-Connecting-IP "";
        }
        location ~ /\. { deny all; }
        location /assets/ {
            try_files $uri =404;
            expires 7d;
        }
        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
