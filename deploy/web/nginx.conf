worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    client_max_body_size 32k;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Only the isolated tunnel connector can supply the visitor's address.
    set_real_ip_from 172.30.72.2;
    real_ip_header CF-Connecting-IP;
    log_format safe_json escape=json '{"time":"$time_iso8601","service":"nowave-edge","request_id":"$request_id","client_ip":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"duration":$request_time,"upstream_status":"$upstream_status","upstream_duration":"$upstream_response_time","limit_req_status":"$limit_req_status","limit_conn_status":"$limit_conn_status"}';
    access_log /dev/stdout safe_json;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=tiles_limit:10m rate=60r/s;
    # Seven on-demand marine families share a bounded budget, separate from
    # profile/publication traffic and authenticated report MVT tiles.
    limit_req_zone $binary_remote_addr zone=marine_tiles_limit:10m rate=120r/s;
    # Pre-rendered worldwide overview has no API, database or supplier work.
    # Keep its burst independent so slow regional detail cannot delay it.
    limit_req_zone $binary_remote_addr zone=seafloor_limit:10m rate=120r/s;
    # Password attempts on the admin sign-in, per visitor. An empty key
    # is not counted, so only the POST of the form uses this zone.
    map $request_method $admin_login_key {
        default "";
        POST $binary_remote_addr;
    }
    limit_req_zone $admin_login_key zone=admin_login:10m rate=10r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    limit_conn_zone $binary_remote_addr zone=marine_connections:10m;
    limit_conn_zone $binary_remote_addr zone=report_tile_connections:10m;
    limit_conn_status 429;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_origin $foreign_origin {
        default 1;
        "" 0;
        "https://no-wave.fr" 0;
        "https://www.no-wave.fr" 0;
        "https://api.no-wave.fr" 0;
    }
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.mapbox.com https://s3.fr-par.scw.cloud https://s3.nl-ams.scw.cloud https://s3.pl-waw.scw.cloud; font-src 'self' https://api.mapbox.com; connect-src 'self' https://api.mapbox.com https://events.mapbox.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Request-ID $request_id always;
    server {
        listen 8080 default_server;
        server_name _;
        location = /health {
            allow 127.0.0.1;
            deny all;
            access_log off;
            return 200 'ok';
        }
        location / { return 421; }
    }
    server {
        listen 8080;
        server_name www.no-wave.fr;
        return 308 https://no-wave.fr$request_uri;
    }
    server {
        listen 8080;
        server_name no-wave.fr api.no-wave.fr;
        root /usr/share/nginx/html;
        index index.html;
        limit_conn connections 30;
        if ($foreign_origin) { return 403; }
        location ^~ /api/v1/map/seafloor/ {
            alias /usr/share/nginx/marine/;
            limit_req zone=seafloor_limit burst=256 nodelay;
            limit_conn marine_connections 256;
            expires 365d;
        }
        # The JPEG itself is limited to 500,000 bytes by FastAPI. Allow the
        # multipart envelope here while keeping the 32k limit on other routes.
        location ~ ^/api/v1/reports/[^/]+/photo/?$ {
            client_max_body_size 512000;
            limit_req zone=api_limit burst=30 nodelay;
            set $api http://api:8000;
            proxy_pass $api;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header CF-Connecting-IP "";
        }
        # Match tiles before the general API regex so map navigation cannot
        # exhaust the request budget used by profile and report endpoints.
        location ~ ^/api/v1/map/tiles/[0-9]+/[0-9]+/[0-9]+\.mvt$ {
            # Shared-IP map navigation has a dedicated bounded tile budget.
            limit_req zone=tiles_limit burst=128 delay=15;
            limit_conn report_tile_connections 128;
            set $api http://api:8000;
            proxy_pass $api;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header CF-Connecting-IP "";
        }
        # Only exact XYZ tile routes use the marine budget; metadata and all
        # other API routes retain the general protection below. Delay bursts
        # before sending them to the API. Marine HTTP/2 streams have their own
        # bounded connection budget so a full viewport cannot starve the API.
        location ~ ^/api/v1/map/(?:bathymetry/[0-9]+/[0-9]+/[0-9]+\.png|(?:depth-contours|soundings|seamarks|underwater-hazards|port-infrastructure|harbours)/[0-9]+/[0-9]+/[0-9]+\.pbf|marine-features/(?:harbours|seamarks|depth-contours|soundings|underwater-hazards)/[0-9]+/[0-9]+/[0-9]+\.geojson)$ {
            limit_req zone=marine_tiles_limit burst=256 delay=64;
            limit_conn marine_connections 256;
            set $api http://api:8000;
            proxy_pass $api;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header CF-Connecting-IP "";
        }
        location ~ ^/(api/|health(?:/|$)|version$) {
            limit_req zone=api_limit burst=30 nodelay;
            set $api http://api:8000;
            proxy_pass $api;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header CF-Connecting-IP "";
        }
        # Server-rendered admin pages (FastAPI + Jinja), not the static site.
        location = /admin/login {
            limit_req zone=api_limit burst=30 nodelay;
            limit_req zone=admin_login burst=5 nodelay;
            set $api http://api:8000;
            proxy_pass $api;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header CF-Connecting-IP "";
        }
        location = /admin {
            limit_req zone=api_limit burst=30 nodelay;
            set $api http://api:8000;
            proxy_pass $api;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header CF-Connecting-IP "";
        }
        # Static resources for the FastAPI admin interface.
        location ^~ /admin-static/ {
            set $api http://api:8000;
            proxy_pass $api;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header CF-Connecting-IP "";
        }

        location ^~ /admin/ {
            limit_req zone=api_limit burst=30 nodelay;
            set $api http://api:8000;
            proxy_pass $api;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header CF-Connecting-IP "";
        }
        location ~ /\. { deny all; }
        # Stable entry points must revalidate after each deployment.
        location = /assets/admin-map.js {
            try_files $uri =404;
            expires -1;
        }
        location = /assets/nowave.css {
            try_files $uri =404;
            expires -1;
        }
        location /assets/ {
            try_files $uri =404;
            expires 7d;
        }
        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
