server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"nowave-web"}';
    }

    location = /assets/admin-map.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = /assets/nowave.css {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    # Standalone mode has no API. Return a valid empty public configuration
    # so the landing page can display its map fallback without an HTML response.
    location = /api/v1/map/web-config {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"mapbox_token":""}';
    }

    location /api/ { return 404; }
    location /admin-static/ { return 404; }
    location = /admin { return 404; }
    location /admin/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
