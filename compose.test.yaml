# Ephemeral database only. No persistent volumes, no Railway credentials.
services:
  database:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_DB: nowave_ci
      POSTGRES_USER: nowave_ci
      POSTGRES_PASSWORD: ci-test-only
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:${NOWAVE_TEST_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nowave_ci -d nowave_ci"]
      interval: 2s
      timeout: 3s
      retries: 30
