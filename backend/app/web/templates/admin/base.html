<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Administration{% endblock %} · NoWave</title>
  {# Inline only: the site CSP allows inline styles but no inline script. #}
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f6f8;
      color: #1b2430;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #0b3d5c;
      color: #fff;
    }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    .card {
      max-width: 400px;
      margin: 48px auto;
      padding: 24px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input[type=email], input[type=password] {
      box-sizing: border-box;
      width: 100%;
      padding: 8px;
      font: inherit;
    }
    button {
      margin-top: 16px;
      padding: 8px 16px;
      font: inherit;
      cursor: pointer;
    }
    header button { margin: 0; }
    .error {
      padding: 8px 12px;
      background: #fdecea;
      color: #8a1c13;
      border-radius: 4px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #12171d; color: #e6e9ed; }
      .card { background: #1c232b; }
      .error { background: #4a1c18; color: #ffd9d4; }
    }
  </style>
</head>
<body>
  {% block header %}{% endblock %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
