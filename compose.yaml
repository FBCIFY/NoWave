services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${NOWAVE_WEB_PORT:-8080}:80"
    restart: unless-stopped

  database:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: nowave-postgis:17-local

    environment:
      POSTGRES_DB: nowave
      POSTGRES_USER: nowave
      POSTGRES_PASSWORD: ${NOWAVE_DB_PASSWORD:?Set NOWAVE_DB_PASSWORD in your environment}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"

    ports:
      - "127.0.0.1:${NOWAVE_DB_PORT:-55432}:5432"

    volumes:
      - nowave_database:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nowave -d nowave"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    environment: &backend-environment
      DATABASE_URL: "postgresql://nowave:${NOWAVE_DB_PASSWORD}@database:5432/nowave"
      PHOTO_STORAGE_BUCKET: ${PHOTO_STORAGE_BUCKET:-}
      PHOTO_STORAGE_REGION: ${PHOTO_STORAGE_REGION:-fr-par}
      SCW_ACCESS_KEY: ${SCW_ACCESS_KEY:-}
      SCW_SECRET_KEY: ${SCW_SECRET_KEY:-}

    command: ["sh", "-c", "alembic -c alembic.ini upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]

    depends_on:
      database:
        condition: service_healthy

  photo-cleanup:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: [photos]
    environment: *backend-environment
    command: [python, -m, app.workers.photo_cleanup]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started

volumes:
  nowave_database:
    name: nowave-database
